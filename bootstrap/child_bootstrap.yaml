AWSTemplateFormatVersion: '2010-09-09'
Description: 'Child bootstrap for Bedrock Governance (child deploy role)'

Parameters:
  RoleName:
    Type: String
    Default: BedrockGovernanceDeployer
    Description: Name of the child deploy role used by Terraform provider assume-role.

  TrustedPrincipalArn:
    Type: String
    Description: IAM principal ARN allowed to assume the deploy role (typically a management execution role).

Resources:
  ChildDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Ref TrustedPrincipalArn

  ChildDeploymentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BedrockGovernanceChildDeployment
      Roles:
        - !Ref ChildDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInferenceProfile
            Effect: Allow
            Action:
              - bedrock:CreateInferenceProfile
              - bedrock:DeleteInferenceProfile
              - bedrock:GetInferenceProfile
              - bedrock:ListInferenceProfiles
              - bedrock:ListTagsForResource
              - bedrock:TagResource
              - bedrock:UntagResource
            Resource: '*'

          - Sid: CloudWatchAlarms
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - cloudwatch:DescribeAlarmHistory
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource: '*'

          - Sid: BedrockAlarmNotifications
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListTopics
              - sns:ListSubscriptions
              - sns:ListTagsForResource
              - sns:TagResource
              - sns:UntagResource
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:GetSubscriptionAttributes
              - sns:SetSubscriptionAttributes
              - sns:ListSubscriptionsByTopic
            Resource: '*'

          - Sid: BedrockCloudTrail
            Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:DeleteTrail
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrail
              - cloudtrail:GetTrailStatus
              - cloudtrail:GetEventSelectors
              - cloudtrail:GetInsightSelectors
              - cloudtrail:ListTrails
              - cloudtrail:StartLogging
              - cloudtrail:StopLogging
              - cloudtrail:AddTags
              - cloudtrail:RemoveTags
              - cloudtrail:ListTags
              - cloudtrail:PutEventSelectors
              - cloudtrail:PutInsightSelectors
            Resource: '*'

          - Sid: BedrockAuditBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucket*
              - s3:GetAccelerateConfiguration
              - s3:PutBucket*
              - s3:PutAccelerateConfiguration
              - s3:DeleteBucket*
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetReplicationConfiguration
              - s3:GetEncryptionConfiguration
            Resource:
              - arn:aws:s3:::*

          - Sid: ReadCallerContext
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - ec2:DescribeRegions
            Resource: '*'

          # Cost limit enforcement (Lambda, schedule, managed block policy). Resources are scoped to
          # the '-bedrock-cost-' names the module creates.
          - Sid: CostEnforcerLambda
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionCodeSigningConfig
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:ListVersionsByFunction
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
            Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:*-bedrock-cost-*

          - Sid: CostEnforcerSchedule
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:ListTagsForResource
              - events:TagResource
              - events:UntagResource
            Resource: !Sub arn:aws:events:*:${AWS::AccountId}:rule/*-bedrock-cost-*

          - Sid: CostEnforcerLogGroup
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:ListTagsForResource
              - logs:TagResource
              - logs:UntagResource
            Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*-bedrock-cost-*

          - Sid: CostEnforcerLogGroupDescribe
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'

          - Sid: CostEnforcerRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PassRole
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/*-bedrock-cost-*

          - Sid: CostLimitBlockPolicy
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListEntitiesForPolicy
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:policy/*-bedrock-cost-limit-block

          # Only needed when cost_limit_block_policy_role_names is set.
          - Sid: CostLimitBlockPolicyAttach
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/*
            Condition:
              ArnLike:
                iam:PolicyARN: !Sub arn:aws:iam::${AWS::AccountId}:policy/*-bedrock-cost-limit-block

Outputs:
  ChildDeployRoleArn:
    Description: IAM role ARN to set as deploy_role_arn for child deployments.
    Value: !GetAtt ChildDeployRole.Arn
