AWSTemplateFormatVersion: '2010-09-09'
Description: 'Management bootstrap for Bedrock Governance (Terraform state backend)'

Parameters:
  BucketNamePrefix:
    Type: String
    Default: bedrock-governance
    Description: Prefix for the Terraform state S3 bucket name.

  LockTableName:
    Type: String
    Default: terraform-locks
    Description: DynamoDB table name used for Terraform state locking.

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-terraform-states'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LockTableName
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  S3BucketName:
    Description: Name of the S3 bucket for Terraform state.
    Value: !Ref TerraformStateBucket

  DynamoDBTableName:
    Description: Name of the DynamoDB table for Terraform locking.
    Value: !Ref TerraformLockTable
